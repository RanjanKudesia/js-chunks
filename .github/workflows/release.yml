name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # OIDC Trusted Publishing (no NPM_TOKEN secret): npm auth'd via a short-lived
    # token GitHub mints for this run. Requires the package to already exist on
    # npm with a Trusted Publisher configured (npmjs.com -> package -> Settings ->
    # Trusted Publisher -> GitHub Actions -> this org/repo/workflow file). The
    # very first publish of a brand-new package must be done manually once
    # (`npm login` + `npm publish`) before this workflow can be used.
    permissions:
      contents: read
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        # Trusted publishing needs npm >= 11.5.1; setup-node's bundled npm may lag.
        run: npm install -g npm@latest

      - name: Install deps
        run: npm ci

      - name: Build wasm (node/web/bundler) + TypeScript
        run: |
          npm run build:wasm
          npm run build

      - name: Test
        run: npm test

      - name: Publish
        # No token: authenticates via OIDC trusted publishing (see permissions
        # above). Provenance is attested automatically under trusted publishing.
        run: npm publish
